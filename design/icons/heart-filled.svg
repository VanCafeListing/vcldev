<!--
  The filled counterpart of heart-outline.svg, for the favourited state.

  Derived from heart-outline.svg rather than sourced separately: potrace traced
  the PDF's outline heart as a ring — an outer contour plus an inner contour
  that carves out the middle. Dropping the inner contour leaves the solid
  silhouette, so the filled and outline hearts are the same artwork at the same
  size and register exactly when one swaps for the other.
-->
