schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Product: VanCafe Listing (VCL) — a discovery app that helps remote workers
  and commuters find cafes suited for working from (wifi, power outlets,
  seating, parking, noise level), not a general review/menu app.

  Tech stack (confirmed):
    - Backend: Supabase (Postgres + Auth + Storage + Edge Functions). A
      Supabase MCP is available in the dev environment for provisioning.
    - Frontend: React Native with Expo, TypeScript. CONFIRMED by the user
      on 2026-08-25 after weighing Flutter. Chosen so app and backend
      logic share one language, and for supabase-js/EAS tooling maturity.
      This is settled — do not re-open it or re-litigate Flutter.
    - Auth providers: email/password, Apple, Google, Facebook OAuth.

  DESIGN SOURCE OF TRUTH — read this before any UI work:

    REVISED 2026-08-25 (user directive, supersedes the original Figma-
    primary call below): design/source/App-design.pdf is now PRIMARY.
    Where the PDF and the Figma Styleguide page both draw a screen, the
    PDF wins — build to its exact colours, layout, and iconography, not
    Figma's. This was triggered by the Home feed: the shipped Figma-
    based version was visually unfaithful (wrong background tone, wrong
    card treatment) next to the PDF's version of the same screen, which
    turned out to be the more finished/intended design. Re-verify any
    already-shipped screen against the PDF before trusting it, even if
    it was previously checked off as "done" against Figma.

    1. PRIMARY: design/source/App-design.pdf. Single page, 9 artboards
       side by side (Splash, Home, Cafe detail, Filters, Sign up,
       Profile menu, Delete-account dialog, Log-out dialog, Profile
       edit) plus the two palette blocks and the "Font: Lato" label.
       Render at high DPI to inspect precisely — text and vector edges
       are crisp at 600dpi (`pdftoppm -r 600 -x -y -W -H ...` to crop a
       single artboard; full-page coordinates come from a low-DPI
       overview render first). Sample exact colours from the render
       with a script (PIL `getcolors` on a small crop, filtered/sorted
       by frequency) rather than eyeballing — see cafe-discovery's
       Home/Cafe-detail rebuild for the pattern. Reuse an existing
       token if a sampled value is within a few hex points of one
       (PDF rasterization introduces antialiasing noise Figma's vector
       fills don't have) — don't multiply near-duplicate tokens.

    2. SECONDARY: the hi-fi Figma file, "App Design" (fileKey
       9JDdHP5R8xc1iShHq8nXQa, page "Styleguide", 70:2098). Access via
       the Figma MCP; load the figma-design-to-code skill BEFORE calling
       get_design_context. Use it only for screens/details the PDF
       doesn't cover: Search_home (75:2474), Filter_popup (75:2531,
       402x819), and Log In (only on the wider board, node 1:2 — the PDF
       has no log-in screen). The frames:
         70:2397  Home            (402x874) — PDF has this screen too;
                    PDF wins per the revision above
         81:2460  Home_1          (Home, alternate card treatment)
         73:2412  Cafe detail     (frame is named "Home") — PDF has
                    this screen too; PDF wins per the revision above
         75:2474  Search_home
         75:2531  Filter_popup

    3. design/source/VanCafe_Logo.ai — the logo artwork.

    The file also contains node 1:2, a large board holding several older
    iterations plus map, favourites and push-notification screens. Treat
    it as history/reference, not as spec, unless the user says otherwise.

    WIP WARNING (from the user): the hi-fi frames are not uniformly
    finished. Flat #D9D9D9 and slate #545F71 rectangles are PLACEHOLDERS
    (image slots, the "Link to map" box), not designed surfaces. Build
    the real component in their place; never reproduce a grey box.

  The logo is a monogram spelling "VAN" (confirmed by the user): the V,
  A and N are interlocked into a single angular mark with a serif foot,
  plus a droplet/leaf accent at the upper right. Refer to it as the VAN
  monogram — never "VLV" (an early misreading). The .ai is
  PDF-compatible and converts cleanly to SVG (3 vector paths, no rasters,
  ~3KB). Two caveats when importing it: the converted viewBox is the full
  792x612pt letter page with the logo small and centred (tighten it to
  the ink bounds, roughly 917x667 units at 600dpi), and every path is
  hardcoded black (make it tintable — e.g. currentColor — since the
  splash renders it in a light tint over brand brown).

  SOURCE VERIFICATION: on 2026-08-25 all planning artifacts were audited
  against the two source files at high resolution. All 20 "Beer Glazed
  Bacon" swatches and the 15-step amber scale were sampled pixel-by-pixel
  and match the values below within rasterization rounding (±1/channel);
  the printed hex labels in the design are authoritative. The design file
  contains exactly 9 screen artboards + 2 palette blocks + a "Font Lato"
  label — nothing else. Fonts in both files are outlined (Type 3,
  unnamed), so "Lato" comes from the design's own text label, not
  embedded font metadata.

  Design tokens.

    Font: Lato. USER-CONFIRMED. The Figma frames render in Inter, but
    both the PDF and the Figma board carry an explicit "Font: Lato" spec
    panel; the Inter in the frames is unstyled WIP. Do not switch to
    Inter.

    Surface colours: taken from the hi-fi Figma frames, USER-CONFIRMED to
    win over the documented scale where they differ. Encoded in
    src/theme/tokens.ts as `figma`:
      #a44012  cafe card body (Home feed)
      #42210c  Apply button (Filters sheet)
      #fb8b24  selected filter chip
      #6F1414  tab bar icons
      #fffbf5  tab bar background
      #FFFCF8  "Off White" — screen background, text on brown surfaces
      #dbf897  Outlet amenity tile
      #d3efb0  Wifi amenity tile
      #3B3B3B  "Dark Grey" (status bar text)
    NOT a brand colour: Figma's named "Primary" variable #545F71, a
    slate blue-grey. It is the same colour as the WIP placeholder boxes
    and the user confirmed it is template residue — use our own neutral
    border instead.

    Icons: the design uses specific icon sets — Flaticon `fi-rr-*` (tab
    bar), `solar:heart-linear`, `tabler:dots-filled`,
    `iconamoon:search-light`, `mage:filter`,
    `material-symbols-light:outlet-rounded`, `radix-icons:cross-2`.
    Exported SVGs live in design/icons/ and are compiled into
    src/components/ui/icon.tsx. NEVER substitute an icon-font glyph
    (Ionicons etc.) or hand-draw a path — export the real asset.

    The documented "Beer Glazed Bacon" scale below is still the palette
    for shading and derived tones; the surface colours above override it
    where a frame paints something specific.
    - Color scale "Beer Glazed Bacon" (brand brown), Base + 10–90% shade/tint:
      shades (darker): 753011, 692b0f, 5e260e, 52220c, 461d0a, 3b1809,
        2f1307, 230e05, 170a03, 0c0502
      tints (lighter): 753011, 834529, 915941, 9e6e58, ac8370, ba9888,
        c8aca0, d6c1b8, e3d6cf, f1eae7
    - Secondary amber/accent numeric scale (0–10):
      0 #FFFFFF, 0.5 #FFF8ED, 1 #FFF0DB, 1.5 #FFE9CA, 2 #FFE1B8, 3 #FFD394,
      4 #FFC471, 5 #FFB54D, 6 #D3953E, 7 #A7752E, 8 #7C551F, 8.5 #664517,
      9 #50350F, 9.5 #3A2508, 10 #241500

  SCREENS — from the Figma Styleguide page (PRIMARY). All frames 402x874
  unless noted. Coordinates are Figma pt from the frame's top-left.

    Home (70:2397) — bg white, status bar #FFFCF8:
      "Find a cafe" bold 32 black at (19,80)
      "Cafes near you" regular 20 black at (22,147); tabler:dots-filled
        24pt at the right on the same line — the filter entry point
      Cafe cards: 362x236, radius 15, bg #a44012, at x21 y186 and y448,
        shadow 0 4px 17.2px -1px rgba(0,0,0,.1). The photo fills the top
        155pt (top corners rounded); the remaining ~81pt is the brown
        footer holding, in #FFFCF8: name bold 20, then a location pin +
        "address · 3.7km" regular 16. solar:heart-linear 24pt sits at the
        footer's right.
      Home_1 (81:2460) is the same screen with the card footer treated
        slightly differently — check both before finalising the card.

    Cafe detail (73:2412) — bg #FFFCF8:
      Hero photo full-width 402x198 at y52 (under the status bar)
      "Tealips Cafe" bold 32 black at (19,270); heart 24pt at the right
      pin + "address · 3.7km" regular 16 black at y318
      "Description:" bold 16 + body regular 16, at (21,366), width 327
      Three amenity tiles 105x101, radius 15, at y435:
        Outlet  x20   bg #dbf897, material-symbols outlet icon 35pt
        Wifi    x148  bg #d3efb0
        seats   x276  bg #d9d9d9 (PLACEHOLDER colour), "24" extrabold 32
                      over "seats" medium 16
        Labels are medium 16 black. NOTE: no verified checkmark — that
        was the older PDF iteration.
      "Location" bold 16 at (21,567), then the map: 362x236 radius 15 at
        y600. In Figma this is a grey box captioned "Link to map" — a
        PLACEHOLDER. Build the real map here.

    Search (75:2474) — this screen IS designed; it was never a gap:
      "Tailored to your needs", a labelled "Search" text input with
      iconamoon:search-light, a separate filter button (mage:filter)
      beside it, "Recent searches" with chips (outlet / desserts /
      matcha — the first two are selected/orange), then
      "Recommendation" with cafe cards.

    Filters (75:2531) — a sheet 402x819, bg white, top corners radius 50:
      "Filters" medium 24 centred at y35; a circled radix cross at
      (27,33); "Clear all" regular 16 at the right, y43
      Section labels regular 16 black: Location (y115), Workspace
      Essentials (y290), Price Range (y403), Seating (y515),
      Atmosphere (y620)
      Chips: height 48, radius 10, bg white, 16pt label. SELECTED chips
      are bg #fb8b24 with white text (e.g. "Nearest"). Chip borders in
      Figma use the leftover slate — use our neutral border instead.
      Price range: a DUAL-THUMB slider — two 15pt round thumbs on a
      track at y453, labelled "$5" (light 13). Confirms min+max, not a
      single bound.
      Apply: 362x48, radius 10, bg #42210c, white medium 20, at y740.

    Tab bar (all main screens): a full-width bar, height 90, bg #fffbf5,
      shadow 0 -5px 12.4px rgba(0,0,0,.15), sitting at y784. Four 32pt
      icons in #6F1414: fi-rr-home, fi-rr-search, fi-rr-map, fi-rr-user.
      It is NOT a floating brown pill — that was the PDF iteration.
      The third tab is a MAP; favourites is reached from Profile.

  SCREENS ONLY IN THE PDF (secondary source — use as-is until the
  designers produce hi-fi versions):
    - Splash/landing: logo on brand-brown, an asymmetric S-curve wave
      (trough ~30% across, crest ~70%) into a cream lower half carrying a
      faint faceted chevron texture and a beige-to-white gradient, then
      "Sign up" (brown), "Log in" (light tint), "Start as a guest".
      The artwork is extracted to assets/images/splash-bg.png.
    - Sign up: "< Back", "Welcome! / Create your new account", First +
      Last Name side by side, Email, Password and Confirm Password (each
      with an eye/eye-slash toggle), the sentence "I agree to the Terms
      of Service", an "Or sign in with" divider, three icon-only social
      buttons (Apple/Google/Facebook), "Sign up", and "Already have an
      account? Sign in".
    - Profile menu: avatar + "Username" + email, a "♥ Favourites"
      button, then Notification / Privacy Policy / Terms of Use (each
      with a chevron), Log Out and Delete Account (no chevron — these
      open dialogs).
    - Confirmation dialogs: "Do you want to delete this account?" and
      "Do you want to log-out from this account?", each Cancel
      (outlined) / confirm (dark charcoal). The Delete button is
      charcoal, NOT red — this design has no destructive red.
    - Profile edit (modal: ✕ + "Profile"): avatar with a dark "Edit"
      button beneath, a single "Name" field, "Email", and a full-width
      dark "Save".

  Button variants (all are implemented in src/components/ui/button.tsx):
    - Primary:   brand brown #753011 — Sign up on the splash
    - Secondary: light brown tint — Log in on the splash
    - Deep:      #42210c — Apply on the Filters sheet
    - Neutral:   dark charcoal #3A3A3A — Save, avatar Edit, and the
                 Delete/Logout confirm buttons in dialogs
    - Outlined:  transparent with a border — Cancel in dialogs, and
                 unselected filter chips

  Implied data model: profiles, cafes (lat/lng — PostGIS or haversine for
  "nearest"/radius queries — photos, description, price range), structured
  amenity/attribute columns per cafe so filters are queryable (not free
  text): wifi, outlets, seat count/category, parking, commuter-friendly,
  seating tags (spacious/wide tables/patio), atmosphere tags
  (quiet/lively); favourites (user_id <-> cafe_id join table); Storage
  bucket for cafe photos; RLS so users only manage their own profile and
  favourites; account deletion must cascade cleanly.

  MVP SCOPE RULE (explicit user directive, hard constraint): the design
  (Figma first, PDF for what Figma lacks) IS the MVP, as-is. Build
  exactly the screens/flows the designers drew and nothing else — do not
  add features, screens, or data beyond what is depicted, even if they
  seem like natural extensions. If a proposal would introduce something
  not in the design, cut it or ask first; never add it by default.

  Explicitly out of scope (do not add unless the user asks):
  reviews/ratings, payments, chat, push-notification backend, dark mode,
  any screen/flow not in the mockup. Also undecided: whether cafes are
  admin-curated or user-submitted — the mockup has no "add a cafe" flow
  for end users, so treat cafe records as admin/seed-provisioned only
  unless the user says otherwise.

  RESOLVED BY FIGMA — these were recorded as "mockup gaps" while the PDF
  was the only source. They are NOT gaps; the designers drew them. Build
  from the Figma frames, not from the guesses that used to live here:
    - Search — designed (75:2474). Has its own layout: "Tailored to your
      needs", a labelled search input, a separate filter button, recent
      searches as chips, and a Recommendation list. It is NOT just the
      Home list with a search bar bolted on.
    - Map — designed on the wider board (node 1:2): a real map with cafe
      pins, a back + search + filter bar, a "List" bottom sheet of cafe
      cards, and a selected-pin state. Not merely a placeholder tab.
    - Favourites — designed on the wider board. Still reached from the
      Profile menu, NOT a bottom-nav tab (that slot is the map).
    - Log in — a "Welcome back!" screen exists on the wider board.
    - Notification settings — a push-notification screen exists on the
      wider board, so the Profile row is not merely a stub.
    Where a screen lives only on board 1:2 rather than the Styleguide
    page, treat it as intent rather than final pixels, and ask before
    investing heavily in its styling.

  REMAINING GAPS (genuinely not drawn anywhere):
    - No back button on the Cafe detail screen, and no Edit affordance on
      the Profile menu header. Default: standard back navigation, and
      tapping the avatar/username opens the Profile-edit modal.

  VISUAL FIDELITY RULE (learned the hard way on the splash screen): the
  mockup is the spec for how a screen LOOKS, not just what it contains.
  Do not approximate a drawn shape with a cheap CSS equivalent and file
  it as "polish" — the splash's wave is an asymmetric S-curve (trough
  left, crest right) that was first shipped as a symmetric border-radius,
  and it read as wrong immediately. When a screen has non-trivial
  artwork:
    - Measure it from `design/source/App-design.pdf` (render it, trace
      the boundary, sample the colours) rather than eyeballing.
    - Extract real artwork as an asset when it cannot be expressed
      faithfully in code — see `assets/images/splash-bg.png`, generated
      from the source with the mockup's own logo/buttons/text removed.
    - Position content by the fractions measured from the source so it
      stays aligned with a stretched background on any screen size.
    - Do not mark a verification task done on routing/behaviour alone
      when the task's screen has a designed appearance; compare the
      rendered screen against the source and say so explicitly.
  Subtle details count: the cream half carries a faint faceted chevron
  texture and a vertical beige-to-white gradient. Check for texture and
  gradients before assuming a region is a flat fill.

  APPROVED DEVIATIONS from the mockup (user-confirmed, do not "correct"
  these back to the drawing):
    - Add a real gating ToS checkbox on Sign Up (mockup shows only a
      sentence) — for auditable consent.
    - Build the Map tab as a real cafe map (see above).
    - Implement avatar/profile-photo upload behind the Profile-edit
      screen's drawn "Edit" button — this pulls an avatars Storage bucket
      + RLS into scope.

  Backend/hosting cost notes (confirmed 2026 pricing, for reference):
  Supabase Free (500MB DB, 50K MAU) covers development; Pro is $25/mo
  once outgrown. Expo/EAS Free covers 15 builds/platform/month; paid
  tiers are usage-based beyond that. App Store costs: Apple Developer
  Program $99/year, Google Play Console $25 one-time. Cafe data will
  live in Supabase Postgres (not Google Sheets/Cloudflare) — Sheets was
  considered as a curation-only front-end that syncs into Supabase, not
  a live data source, to keep PostGIS proximity queries and the
  favourites FK/RLS relationship intact.

