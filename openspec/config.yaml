schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Product: VanCafe Listing (VCL) — a discovery app that helps remote workers
  and commuters find cafes suited for working from (wifi, power outlets,
  seating, parking, noise level), not a general review/menu app.

  Tech stack (confirmed):
    - Backend: Supabase (Postgres + Auth + Storage + Edge Functions). A
      Supabase MCP is available in the dev environment for provisioning.
    - Frontend: React Native with Expo, TypeScript. CONFIRMED by the user
      on 2026-08-25 after weighing Flutter. Chosen so app and backend
      logic share one language, and for supabase-js/EAS tooling maturity.
      This is settled — do not re-open it or re-litigate Flutter.
    - Auth providers: email/password, Apple, Google, Facebook OAuth.

  Design system source: Figma-exported PDF ("App design.pdf") + an
  Illustrator logo ("VanCafe_Logo.ai"), both supplied by the user and
  committed to the repo at design/source/ (App-design.pdf,
  VanCafe_Logo.ai) as the project's source of truth.

  The logo is a monogram spelling "VAN" (confirmed by the user): the V,
  A and N are interlocked into a single angular mark with a serif foot,
  plus a droplet/leaf accent at the upper right. Refer to it as the VAN
  monogram — never "VLV" (an early misreading). The .ai is
  PDF-compatible and converts cleanly to SVG (3 vector paths, no rasters,
  ~3KB). Two caveats when importing it: the converted viewBox is the full
  792x612pt letter page with the logo small and centred (tighten it to
  the ink bounds, roughly 917x667 units at 600dpi), and every path is
  hardcoded black (make it tintable — e.g. currentColor — since the
  splash renders it in a light tint over brand brown).

  SOURCE VERIFICATION: on 2026-08-25 all planning artifacts were audited
  against the two source files at high resolution. All 20 "Beer Glazed
  Bacon" swatches and the 15-step amber scale were sampled pixel-by-pixel
  and match the values below within rasterization rounding (±1/channel);
  the printed hex labels in the design are authoritative. The design file
  contains exactly 9 screen artboards + 2 palette blocks + a "Font Lato"
  label — nothing else. Fonts in both files are outlined (Type 3,
  unnamed), so "Lato" comes from the design's own text label, not
  embedded font metadata.

  Design tokens (confirmed from the source PDF):
    - Font: Lato.
    - Color scale "Beer Glazed Bacon" (brand brown), Base + 10–90% shade/tint:
      shades (darker): 753011, 692b0f, 5e260e, 52220c, 461d0a, 3b1809,
        2f1307, 230e05, 170a03, 0c0502
      tints (lighter): 753011, 834529, 915941, 9e6e58, ac8370, ba9888,
        c8aca0, d6c1b8, e3d6cf, f1eae7
    - Secondary amber/accent numeric scale (0–10):
      0 #FFFFFF, 0.5 #FFF8ED, 1 #FFF0DB, 1.5 #FFE9CA, 2 #FFE1B8, 3 #FFD394,
      4 #FFC471, 5 #FFB54D, 6 #D3953E, 7 #A7752E, 8 #7C551F, 8.5 #664517,
      9 #50350F, 9.5 #3A2508, 10 #241500

  Screens in the mockup — all 9, verified (iOS status-bar style, mobile only):
    - Splash/landing: logo on brand-brown with a wave curve into a cream
      lower half, then "Sign up" (brown), "Log in" (light tint),
      "Start as a guest" (plain text). No status bar on this screen.
    - Sign up: "< Back", "Welcome! / Create your new account",
      First Name* + Last Name* side by side, Email*, Password* and
      Confirm Password* (each with an eye/eye-slash visibility toggle),
      then centred text "I agree to the Terms of Service" (link-coloured
      tail), an "Or sign in with" divider, three icon-only social buttons
      (Apple/Google/Facebook), a "Sign up" button, and
      "Already have an account? Sign in".
      NOTE: no ToS CHECKBOX is drawn — only the sentence. The user
      decided to ADD a real gating checkbox anyway (auditable consent);
      this is a deliberate, approved deviation from the mockup.
    - Home feed: "Hi, Alice!", then "Cafes near you" with a "..." icon at
      the right (the only plausible filter entry point). Cards carry one
      photo, name, a pin icon + address, and an outline heart at the
      right. Distance is appended to the address ("address · 3.7km") and
      is absent on the first card — treat distance as optional per card.
    - Cafe detail: ONE full-bleed hero photo (not a gallery/carousel),
      name + outline heart, pin + address, a brown "3.7km" distance
      badge, "About" + description, then three amber amenity tiles —
      Outlets and Wi-Fi each with an amber circled checkmark, and a
      "20+ seats" count tile with NO checkmark — then "Location" and a
      map with a pin. Bottom nav is present. No back button is drawn.
    - Filters (a modal: ✕, "Filters", "Clear all"; no bottom nav):
      Location (Nearest [selected/amber], Commuter Friendly, Easy
      Parking), Workspace Essentials (Free Wi-Fi, Outlets), Price Range
      (a DUAL-THUMB range slider — two amber thumbs with an amber fill
      between them — labelled $5 and $20), Seating (Spacious, Wide
      Tables, Patio Seating), Atmosphere (Quiet, Lively), and a brown
      "Apply" button.
    - Bottom nav (4 tabs): Home, Search, MAP (a location pin on a folded
      map), Profile. The third tab is a MAP, not a bookmark/favourites
      tab — favourites are reached from the Profile menu instead.
    - Profile menu: avatar + "Username" + email (no Edit affordance drawn
      here), an amber "♥ Favourites" button, then a grouped list —
      Notification, Privacy Policy, Terms of Use (each with a "›"
      chevron), Log Out and Delete Account (no chevron; these open
      dialogs). Bottom nav present.
    - Confirmation dialogs: "Do you want to delete this account?" with
      Cancel (outlined) / Delete (dark charcoal), and "Do you want to
      log-out from this account?" with Cancel / Logout. NOTE: the Delete
      button is charcoal, NOT red — there is no destructive-red styling
      anywhere in this design.
    - Profile edit (a modal: ✕ + "Profile" title; no bottom nav): avatar
      with a dark "Edit" button beneath it, a single "Name" field (not
      first/last), an "Email" field, and a full-width dark "Save" button.

  Button variants present in the design (all three are needed):
    - Primary: brand brown (#753011) — Sign up, Apply
    - Secondary: light brown tint — Log in on the splash
    - Neutral/dark: dark charcoal (~#3A3A3A) — Save, avatar Edit, and the
      Delete/Logout confirm buttons in dialogs
    - Outlined: transparent with a thin border — Cancel in dialogs, and
      the unselected filter chips

  Implied data model: profiles, cafes (lat/lng — PostGIS or haversine for
  "nearest"/radius queries — photos, description, price range), structured
  amenity/attribute columns per cafe so filters are queryable (not free
  text): wifi, outlets, seat count/category, parking, commuter-friendly,
  seating tags (spacious/wide tables/patio), atmosphere tags
  (quiet/lively); favourites (user_id <-> cafe_id join table); Storage
  bucket for cafe photos; RLS so users only manage their own profile and
  favourites; account deletion must cascade cleanly.

  MVP SCOPE RULE (explicit user directive, hard constraint): the supplied
  PDF mockup and this design system ARE the MVP, as-is. Build exactly the
  screens/flows shown in the mockup and nothing else — do not add
  features, screens, or data beyond what's depicted, even if they seem
  like natural extensions. If a proposal or design would introduce
  something not visible in the mockup, cut it or ask first; never add it
  by default.

  Explicitly out of scope (do not add unless the user asks):
  reviews/ratings, payments, chat, push-notification backend, dark mode,
  any screen/flow not in the mockup. Also undecided: whether cafes are
  admin-curated or user-submitted — the mockup has no "add a cafe" flow
  for end users, so treat cafe records as admin/seed-provisioned only
  unless the user says otherwise.

  KNOWN MOCKUP GAPS (implied by an icon/button but never actually drawn).
  Default for all: reuse the closest existing mockup screen/primitives
  rather than inventing new layouts; flag the default in the relevant
  proposal; stop defaulting the moment the user supplies a real design.
    - No Log In screen (Sign Up's "Already have an account? Sign in" and
      the splash's "Log in" both point at one). Default: Sign Up's field
      set minus name/confirm/ToS.
    - No Search screen (only the bottom-nav icon). Default: the Home
      feed's card list plus a text search bar.
    - No Map screen, despite the map tab appearing in all four drawn nav
      bars. DECIDED with the user: build a real cafe map (pins → cafe
      detail) as its own `cafe-map` change, rather than shipping an empty
      tab. This is an approved addition beyond what's drawn.
    - No Favourites list screen — only the Profile menu's "♥ Favourites"
      button and the heart toggles on cards. IMPORTANT: favourites is NOT
      a bottom-nav tab (that slot is the map); the list is a screen
      pushed from the Profile menu. Default layout: the Home feed's card
      list, filtered to favourites.
    - No filter entry point drawn on Home/Search. Default: Home's "..."
      icon opens Filters; Search gets an analogous icon.
    - No back button on the Cafe detail screen, and no Edit affordance on
      the Profile menu header. Default: standard back navigation, and
      tapping the avatar/username opens the Profile-edit modal.

  APPROVED DEVIATIONS from the mockup (user-confirmed, do not "correct"
  these back to the drawing):
    - Add a real gating ToS checkbox on Sign Up (mockup shows only a
      sentence) — for auditable consent.
    - Build the Map tab as a real cafe map (see above).
    - Implement avatar/profile-photo upload behind the Profile-edit
      screen's drawn "Edit" button — this pulls an avatars Storage bucket
      + RLS into scope.

  Backend/hosting cost notes (confirmed 2026 pricing, for reference):
  Supabase Free (500MB DB, 50K MAU) covers development; Pro is $25/mo
  once outgrown. Expo/EAS Free covers 15 builds/platform/month; paid
  tiers are usage-based beyond that. App Store costs: Apple Developer
  Program $99/year, Google Play Console $25 one-time. Cafe data will
  live in Supabase Postgres (not Google Sheets/Cloudflare) — Sheets was
  considered as a curation-only front-end that syncs into Supabase, not
  a live data source, to keep PostGIS proximity queries and the
  favourites FK/RLS relationship intact.

